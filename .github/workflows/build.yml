name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restructure flat files
        run: bash restructure.sh

      - name: Show project tree
        run: find . -path ./.git -prune -o -type f -print | sort | head -100

      - name: Install Gradle 9.6.0
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK platform and build-tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle --version && gradle :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: minimal-candy-browser-apk
          path: app/build/outputs/apk/debug/*.apk
